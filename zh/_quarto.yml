project:
  type: website
  output-dir: ../_site/zh

lang: zh

website:
  title: "Jing Hu · 中德气候行动对比"
  description: "在欧盟气候政策框架下对比中德两国的气候行动：目标、政策工具与排放，均附一手来源。"
  site-url: https://jinggling09.github.io/zh
  repo-url: https://github.com/jinggling09/jinggling09.github.io
  repo-actions: [issue]
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    title: "Jing Hu"
    left:
      - href: index.qmd
        text: "首页"
      - href: ziele/index.qmd
        text: "目标"
      - text: "政策工具"
        menu:
          - href: wissen/index.qmd
            text: "概览与时间轴"
          - href: wissen/china-ets.qmd
            text: "中国全国碳市场"
          - href: wissen/eu-ets.qmd
            text: "欧盟碳市场、ETS2 与德国 BEHG"
          - href: wissen/cbam.qmd
            text: "CBAM 基础"
          - href: wissen/schnittstellen.qmd
            text: "中国碳市场 ↔ CBAM 接口"
      - href: daten/index.qmd
        text: "可再生能源"
      - text: "排放"
        menu:
          - href: wissen/emissionen-de.qmd
            text: "德国温室气体看板"
          - href: wissen/stromsektor.qmd
            text: "电力部门：德国与中国"
      - href: projekte/index.qmd
        text: "项目"
      - href: ueber-mich.qmd
        text: "关于我"
    right:
      - href: quellen.qmd
        text: 来源与方法
      - icon: translate
        text: 中文
        menu:
          - text: Deutsch
            href: https://jinggling09.github.io/
          - text: English
            href: https://jinggling09.github.io/en/
          - text: 中文
            href: https://jinggling09.github.io/zh/
      - icon: github
        href: https://github.com/jinggling09
        aria-label: GitHub
  page-footer:
    left: "© 2026 Jing Hu"
    right: "所有内容均注明来源 · [来源与方法](/quellen.qmd)"

format:
  html:
    theme:
      light: [litera, ../styles/custom.scss]
    toc: true
    toc-location: right
    grid:
      sidebar-width: 0px
      body-width: 940px
      margin-width: 260px
      gutter-width: 2rem
    toc-title: "本页目录"
    toc-depth: 2
    smooth-scroll: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/jinggling09\.github\.io\/'
    include-after-body:
      - ../_includes/lang-switch.html
      - ../_includes/literatur-toggle.html
    citations-hover: true
    reference-location: margin

bibliography: references.bib
link-citations: true

execute:
  freeze: auto
