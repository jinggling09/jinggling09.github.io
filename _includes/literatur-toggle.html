<script>
/* Literaturverzeichnis am Seitenende zusammenklappen: Überschrift wird zur Aufklapp-Zeile
   mit Anzahl der Quellen. Sprünge zu einer Quelle (#ref-…) öffnen die Liste automatisch. */
(function () {
  var sec = document.getElementById("quarto-bibliography");
  var refs = document.getElementById("refs");
  if (!sec || !refs) return;
  var h = sec.querySelector(".quarto-appendix-heading");
  var details = document.createElement("details");
  details.className = "literatur";
  var summary = document.createElement("summary");
  var n = refs.querySelectorAll(".csl-entry").length;
  summary.innerHTML = '<span class="literatur-titel">' + (h ? h.textContent : "Literatur") +
                      '</span> <span class="literatur-anzahl">(' + n + ')</span>';
  details.appendChild(summary);
  details.appendChild(refs);
  if (h) h.replaceWith(details); else sec.prepend(details);

  function oeffneBeiSprung() {
    if (location.hash.indexOf("#ref-") === 0) {
      details.open = true;
      var ziel = document.getElementById(location.hash.slice(1));
      if (ziel) ziel.scrollIntoView();
    }
  }
  window.addEventListener("hashchange", oeffneBeiSprung);
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href*="#ref-"]');
    if (a) details.open = true;
  });
  oeffneBeiSprung();
})();
</script>
<script>
/* Belege-Zeilen (.belege) zusammenklappen: das fett gesetzte erste Wort („Belege“, „Sources“, „来源“)
   wird zur Aufklapp-Zeile, der Rest erscheint erst nach Klick. */
(function () {
  document.querySelectorAll("div.belege").forEach(function (box) {
    var p = box.querySelector("p");
    var b = p && p.firstElementChild;
    var titel = "Belege";
    if (b && b.tagName === "STRONG" && p.firstChild === b) {
      titel = b.textContent.trim();
      var rest = b.nextSibling;
      b.remove();
      if (rest && rest.nodeType === 3) rest.textContent = rest.textContent.replace(/^\s*·\s*/, "");
    }
    var d = document.createElement("details");
    d.className = "belege-klapp";
    var sum = document.createElement("summary");
    sum.textContent = titel;
    d.appendChild(sum);
    while (box.firstChild) d.appendChild(box.firstChild);
    box.appendChild(d);
    // .belege.am-bild: Aufklapp-Zeile ans Ende der Bildunterschrift davor (z. B. Videos)
    var fig = box.classList.contains("am-bild") && box.previousElementSibling;
    var cap = fig && fig.querySelector("figcaption");
    if (cap) { cap.appendChild(document.createTextNode(" ")); cap.appendChild(d); box.remove(); }
  });
})();
</script>
