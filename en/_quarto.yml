  site-url: https://jinggling09.github.io/en
  repo-url: https://github.com/jinggling09/jinggling09.github.io
  repo-actions: [issue]
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    title: false
    left:
      - href: index.qmd
        text: "Home"
      - href: ziele/index.qmd
        text: "Targets"
      - text: "Carbon pricing"
        menu:
          - href: wissen/index.qmd
            text: "Overview & timeline"
          - href: wissen/china-ets.qmd
            text: "China's national ETS"
          - href: wissen/eu-ets.qmd
            text: "EU ETS, ETS2 & BEHG"
          - href: wissen/cbam.qmd
            text: "CBAM – the basics"
          - href: wissen/schnittstellen.qmd
            text: "Interface China ↔ CBAM"
      - href: daten/index.qmd
        text: "Renewables"
      - text: "Emissions"
        menu:
          - href: wissen/emissionen-de.qmd
            text: "GHG dashboard Germany"
          - href: wissen/stromsektor.qmd
            text: "Power sector: Germany & China"
      - href: projekte/index.qmd
        text: "Projects"
      - href: ueber-mich.qmd
        text: "About"
    right:
      - href: quellen.qmd
        text: Sources & method
      - icon: translate
        text: English
        menu:
          - text: Deutsch
            href: https://jinggling09.github.io/
          - text: English
            href: https://jinggling09.github.io/en/
          - text: 中文
            href: https://jinggling09.github.io/zh/
      - icon: github
        href: https://github.com/jinggling09
        aria-label: GitHub
  page-footer:
    left: "© 2026 Jing Hu"
    right: "Every statement is sourced · [Sources & method](/quellen.qmd)"

format:
  html:
    theme:
      light: [litera, ../styles/custom.scss]
    toc: true
    toc-location: right
    grid:
      sidebar-width: 0px
      body-width: 940px
      margin-width: 260px
      gutter-width: 2rem
    toc-title: "On this page"
    toc-depth: 2
    smooth-scroll: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/jinggling09\.github\.io\/'
    include-after-body:
      - ../_includes/lang-switch.html
      - ../_includes/literatur-toggle.html
    citations-hover: true
    reference-location: margin

bibliography: ../references.bib
link-citations: true

execute:
  freeze: auto
