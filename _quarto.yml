project:
  type: website
  output-dir: _site
  # Deutsch im Stammverzeichnis; en/ und zh/ sind eigene Quarto-Projekte (siehe scripts/build.sh)
  render:
    - "*.qmd"
    - "ziele/*.qmd"
    - "laender/*.qmd"
    - "energiewende/*.qmd"
    - "wissen/*.qmd"
    - "daten/*.qmd"
    - "projekte/*.qmd"
  resources:
    - "daten/data/*.csv"
    - "daten/data/*.json"
    - "images/*"
    - "dokumente/*"

lang: de

website:
  title: "Jing Hu · Klimaschutz im Vergleich"
  description: "Klimaschutz in Deutschland und China im Vergleich, im Rahmen der EU-Klimapolitik: Ziele, Instrumente und Emissionen – mit Primärquellen."
  site-url: https://jinggling09.github.io
  repo-url: https://github.com/jinggling09/jinggling09.github.io
  repo-actions: [issue]
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    title: false
    left:
      - text: "Start"
        menu:
          - href: index.qmd
            text: "Übersicht"
          - href: laender/deutschland.qmd
            text: "Deutschland: Klimaschutz im Überblick"
          - href: laender/eu.qmd
            text: "Europäische Union: Klimaschutz im Überblick"
          - href: laender/china.qmd
            text: "China: Klimaschutz im Überblick"
      - href: ziele/index.qmd
        text: "Ziele"
      - text: "CO₂-Bepreisung"
        menu:
          - href: wissen/index.qmd
            text: "Überblick & Zeitleiste"
          - href: wissen/china-ets.qmd
            text: "Chinas nationaler Emissionshandel"
          - href: wissen/eu-ets.qmd
            text: "EU-ETS, ETS 2 & BEHG"
          - href: wissen/cbam.qmd
            text: "CBAM – Grundlagen"
          - href: wissen/schnittstellen.qmd
            text: "Schnittstelle China ↔ CBAM"
      - text: "Energiewende"
        menu:
          - href: daten/index.qmd
            text: "Überblick: Ausbau Wind & Solar"
          - href: energiewende/photovoltaik.qmd
            text: "Photovoltaik"
          - href: energiewende/windenergie.qmd
            text: "Windenergie"
          - href: energiewende/waermepumpen.qmd
            text: "Wärmepumpen"
      - text: "Emissionen"
        menu:
          - href: wissen/emissionen-de.qmd
            text: "THG-Dashboard Deutschland"
          - href: wissen/stromsektor.qmd
            text: "Stromsektor: Deutschland & China"
      - href: projekte/index.qmd
        text: "Projekte"
      - href: ueber-mich.qmd
        text: "Über mich"
    right:
      - href: quellen.qmd
        text: Quellen & Methodik
      - icon: translate
        text: Deutsch
        menu:
          - text: Deutsch
            href: https://jinggling09.github.io/
          - text: English
            href: https://jinggling09.github.io/en/
          - text: 中文
            href: https://jinggling09.github.io/zh/
      - icon: github
        href: https://github.com/jinggling09
        aria-label: GitHub
  page-footer:
    left: "© 2026 Jing Hu"
    right: "Alle Angaben mit Quellenbeleg · [Quellen & Methodik](/quellen.qmd)"

format:
  html:
    theme:
      light: [litera, styles/custom.scss]
    toc: true
    toc-location: right
    grid:
      sidebar-width: 0px
      body-width: 940px
      margin-width: 260px
      gutter-width: 2rem
    toc-title: "Auf dieser Seite"
    toc-depth: 2
    smooth-scroll: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/jinggling09\.github\.io\/'
    include-after-body:
      - _includes/lang-switch.html
      - _includes/literatur-toggle.html
    citations-hover: true
    reference-location: margin

bibliography: references.bib
link-citations: true

execute:
  freeze: auto
