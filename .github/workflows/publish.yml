name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # monatlich am 1. um 05:17 UTC (für künftige Datenaktualisierung)
    - cron: "17 5 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Quarto installieren
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Seite rendern
        run: quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
