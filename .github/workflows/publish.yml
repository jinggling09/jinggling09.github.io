name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # monatlich am 3. um 05:17 UTC – Monatswerte des Vormonats sind dann vollständig
    - cron: "17 5 3 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten Deutschland abrufen (Energy-Charts)
        run: |
          if ! python scripts/fetch_energy_charts.py; then
            if [ -f daten/data/de_generation_monthly.csv ]; then
              echo "::warning::Datenabruf fehlgeschlagen – vorhandene Daten werden verwendet."
            else
              exit 1
            fi
          fi

      - name: Geänderte Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/data
          if ! git diff --cached --quiet; then
            git commit -m "Daten aktualisiert (Energy-Charts)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Quarto installieren
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Seite rendern
        run: quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
